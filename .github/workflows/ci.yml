name: CI

# Pull requests run it here; pushes to main run it through release.yml.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  packages:
    name: Build, typecheck and test packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run packages:build

      - name: Typecheck
        run: npm run packages:typecheck

      - name: Test
        run: npm run packages:test
