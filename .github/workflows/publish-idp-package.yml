name: Publish idp package

on:
  push:
    branches: [main]
    paths:
      - "packages/idp-client/**"
      - ".github/workflows/publish-idp-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        working-directory: packages/idp-client

      - name: Build
        run: npm run build
        working-directory: packages/idp-client

      - name: Test
        run: npm test
        working-directory: packages/idp-client

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
        working-directory: packages/idp-client

      - name: Build
        run: npm run build
        working-directory: packages/idp-client

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/idp-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
