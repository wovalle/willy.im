name: Release

# On every push to main: with pending changesets, open or update the
# "Version Packages" PR; once that PR is merged (no changesets left), publish
# every package whose version isn't on npm yet.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored
# anywhere. Each published package names this repository and this workflow file
# as its trusted publisher on npmjs.com (package -> Settings -> Trusted
# publishing), and npm issues a short-lived credential to the job through
# `id-token: write`. Provenance is attached automatically. A new package has to
# be given a trusted publisher on npmjs.com before its first publish from here.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Version PR or publish
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          create-github-releases: true
          push-git-tags: true
